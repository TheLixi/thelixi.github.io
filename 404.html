<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Netlen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/media/netlen-logo.png" type="image/png">
<style>
  :root { --bg: #eef0f3; --ink: #0b0c0e; --muted: #5d6470; --action: #1f2de6; }
  * { box-sizing: border-box; } html, body { margin: 0; }
  body { min-height: 100svh; display: grid; place-content: center; gap: 16px; padding: 24px; background: var(--bg); color: var(--ink);
         font: 400 18px/1.5 "Urbanist", system-ui, sans-serif; }
  h1 { margin: 0; font-size: clamp(32px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 500; }
  p { margin: 0; color: var(--muted); max-width: 40ch; }
  a { justify-self: start; display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 99px;
      background: var(--action); color: #fff; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
  <h1>Bu sayfa yok</h1>
  <p>Aradığın adres taşınmış ya da yanlış yazılmış olabilir. Netlen'in ana sayfasından devam edebilirsin.</p>
  <a href="/">Ana sayfaya dön</a>
</body>
</html>
